name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    # Keep this job name stable: branch rulesets require the "preflight" check by name.
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # v5 on purpose: v6 moves caching into a proprietary component with separate ToS.
      - uses: gradle/actions/setup-gradle@v5
        with:
          # Only main writes the cache; PRs (including agent PRs) read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Preflight
        run: ./gradlew preflight --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
