plugins {
    id 'com.diffplug.spotless' version '8.10.1'
    id "com.android.application" version "9.4.0" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.10"
    id "org.jetbrains.kotlin.plugin.serialization" version "2.4.10"
}

subprojects {
    apply plugin: 'com.diffplug.spotless'
    spotless {
        kotlin {
            target '**/*.kt'
            targetExclude('**/build/**/*.kt')
            targetExclude('bin/**/*.kt')

            ktlint()
        }
    }
}

// The single "is this change mergeable?" gate. CI runs exactly this, and agents must run it
// before opening or updating a PR. Keep it JVM-only (no emulator) so it stays fast.
tasks.register('preflight') {
    group = 'verification'
    description = 'Runs formatting, lint and unit tests. Must pass before a PR is opened.'
    dependsOn subprojects.collect { "${it.path}:spotlessCheck" }
    dependsOn ':app:lintDebug', ':app:testDebugUnitTest'
}