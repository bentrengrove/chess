plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'io.github.takahirom.roborazzi'
}

android {
    namespace = "com.bentrengrove.chess"
    compileSdk 37

    defaultConfig {
        applicationId "com.bentrengrove.chess"
        minSdkVersion 28
        targetSdkVersion 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            // Robolectric needs the merged resources to render composables for screenshot tests.
            includeAndroidResources = true
        }
    }
}

roborazzi {
    outputDir = file("src/test/screenshots")
}

dependencies {
    implementation(platform("androidx.compose:compose-bom:2026.08.00"))

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core:1.7.8"
    implementation "androidx.compose.ui:ui-tooling"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation "androidx.navigation3:navigation3-runtime:1.1.7"
    implementation "androidx.navigation3:navigation3-ui:1.1.7"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-core:1.11.0"
    implementation "androidx.activity:activity-compose"

    testImplementation 'junit:junit:4.+'
    testImplementation "androidx.compose.ui:ui-test-junit4"
    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:1.75.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:1.75.0"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-junit-rule:1.75.0"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}